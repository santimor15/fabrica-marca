<html><head><meta charset="utf-8"><style>*{box-sizing:border-box;margin:0}</style></head>
<body style="width:1080px;height:1080px;font-family:var(--font-sans);background:var(--pink-500);position:relative;overflow:hidden">
<div style="position:absolute;inset:0;background:linear-gradient(160deg,var(--magenta-500) 0%,var(--pink-500) 55%,#ffb020 120%)"></div>
<div style="position:absolute;left:60px;top:60px;color:#fff;font-family:var(--font-display);text-transform:uppercase;letter-spacing:0.06em;font-size:40px" data-slot="marca">Cocosandía</div>
<div style="position:absolute;right:60px;top:64px;background:#fff;color:var(--brand-primary);font-weight:700;font-size:20px;padding:10px 24px;border-radius:999px" data-slot="badge">Nuevo</div>
<div style="position:absolute;left:80px;right:80px;top:220px;bottom:220px;background:rgba(255,255,255,0.14);border-radius:32px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.6);font-size:22px;overflow:hidden" data-slot="imagen">foto del producto</div>
<div style="position:absolute;left:60px;bottom:70px;color:#fff">
<div style="font-family:var(--font-display);text-transform:uppercase;letter-spacing:0.02em;font-size:56px" data-slot="titulo">Conjunto Divina</div>
<div style="font-size:24px;font-weight:600;margin-top:10px;max-width:820px" data-slot="texto">$129.000</div>
</div>
